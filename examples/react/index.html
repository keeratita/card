<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@keeratita/card - React Examples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      :root {
        --ios-blue: #0a84ff;
        --ios-red: #ff453a;
        --ios-green: #30d158;
        --bg-color: #050608;
        --card-bg: rgba(255, 255, 255, 0.03);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.55);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
      }

      .container {
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        width: 220px;
        background-color: rgba(255, 255, 255, 0.02);
        border-right: 1px solid var(--border-color);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .sidebar-header {
        padding: 0 8px 20px 8px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 16px;
      }

      .sidebar-header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .sidebar-header p {
        margin: 4px 0 0 0;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav button {
        padding: 8px 12px;
        text-align: left;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s ease;
        color: var(--text-secondary);
        background-color: transparent;
        white-space: nowrap;
      }

      .nav button:hover {
        color: var(--text-primary);
        background-color: rgba(255, 255, 255, 0.04);
      }

      .nav button.active {
        color: var(--ios-blue);
        background-color: rgba(10, 132, 255, 0.12);
      }

      .main {
        flex: 1;
        padding: 40px 48px;
        overflow-y: auto;
        background-color: var(--bg-color);
      }

      .content {
        max-width: 800px;
      }

      .content-card {
        background-color: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 32px;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      #root {
        min-height: 400px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Card Form</h1>
          <p>React Examples</p>
        </div>
        <nav class="nav" id="navMenu">
          <button data-example="home" class="active">Intro</button>
          <button data-example="basic">Basic Form</button>
          <button data-example="presets">Presets</button>
          <button data-example="validation">Validators</button>
          <button data-example="multistep">Multi-Step</button>
          <button data-example="preview">Live Preview</button>
          <button data-example="omise">Omise Adapter</button>
          <button data-example="dark-theme">Dark Theme</button>
          <button data-example="corporate">Corporate</button>
          <button data-example="gradient">Gradient</button>
          <button data-example="minimal">Minimal</button>
          <button data-example="flip-card">Flip Card</button>
          <button data-example="country-dropdown">Country Dropdown</button>
        </nav>
      </aside>
      <main class="main">
        <div id="root"></div>
      </main>
    </div>
    <script type="module" src="/main.jsx"></script>
    <script>
      // Simple navigation handler
      const buttons = document.querySelectorAll('.nav button');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          window.location.hash = btn.dataset.example;
        });
      });
    </script>
  </body>
</html>
