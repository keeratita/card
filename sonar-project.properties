# SonarQube project configuration
# No AI identity exists in this file.

sonar.projectKey=keeratita-card
sonar.projectName=keeratita-card
sonar.projectVersion=1.0.0

# Path to the source directories
sonar.sources=src

# Path to the test directories
sonar.tests=tests

# Exclusions from analysis
sonar.exclusions=node_modules/**, dist/**, examples/**, tests/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Coverage report paths (Vitest LCOV format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
